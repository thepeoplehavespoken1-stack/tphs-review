name: Audit sound effects (YAMNet)
on:
  workflow_dispatch:
    inputs:
      states: {description: 'JSON list of {code,slug}', required: true}
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        st: ${{ fromJSON(inputs.states) }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && pip install -q tensorflow-cpu tensorflow-hub
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          C=${{ matrix.st.code }}
          gh release download ${{ matrix.st.slug }}-parts -R ${{ github.repository }} -p ${C}_03_sound_effects.mp3
          mkdir out; python3 pipeline/sfx_audit.py ${C}_03_sound_effects.mp3 $C out
          gh release upload review-sheets out/${C}_sfx_report.txt out/${C}_sfx_events.json -R ${{ github.repository }} --clobber
